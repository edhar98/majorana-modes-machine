name: Compile Slides, Notes, and Reports
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Presentation Slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation/**/slides.tex
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Compile Notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: notes/*.tex
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Render Report AI Blocks as Plain Text
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/{{\\color{aicolor}#1}}/{#1}/g' reports/*/report.tex

      - name: Compile Reports
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reports/**/report.tex
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Build GitHub Pages Site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py --output web_output --version "${GITHUB_SHA:-local}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_output
